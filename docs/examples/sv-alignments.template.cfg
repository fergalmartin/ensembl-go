# Ensembl Go structural-variation alignment metadata
# Copy this file, fill in the paths, then use Structural Variation >
# Configuration > Load file. The registration form remains available.
# Each record describes one directed reference-to-target alignment.
# Separate records with --- on a line by itself. Add as many as needed.
# Blank lines and lines beginning with # or ; are ignored.
# Paths can be absolute, start with ~, or be relative to this config file.
# Unquoted values are literal: spaces, #, backslashes and = are preserved.
# Put comments on their own lines. Quoted values use JSON string escaping.

# REQUIRED FIELDS (all five must be filled in for each record)
# Unique display label; re-registering the same label updates that alignment.
label = GRCh38 to HG00438 paternal
# Assembly accession of the anchor genome, matching its local download.
reference_accession = GCA_000001405.29
# Assembly accession of the genome being compared with the anchor.
target_accession = GCA_018472595.2
# BigBed-indexed chain alignment, not a plain .chain or feature BigBed.
chain = chains/alt_hg00438_to_ref_grch38.bigChain.bb
# Genome described by the indexed BED coordinates: reference or target.
# This does NOT change which genome is the anchor.
indexed_side = target

# OPTIONAL FIELDS (remove or leave blank when unused)
# Free text shown in the available alignments list.
description =
# Human-readable assembly names and scientific species names.
reference_assembly_name = GRCh38.p14
target_assembly_name = HG00438_pat_hprc_f2
reference_species = Homo sapiens
target_species = Homo sapiens
# Other identifiers for the same assembly, separated by commas.
# Do not list species-wide aliases such as Human here.
reference_aliases =
target_aliases =
# Existing HAL mapping TSVs: useful when sequence names need translation.
# Usually unnecessary; chr1/1 differences are handled automatically.
reference_mapping =
target_mapping =
# Alternatively, supply specific sequence-name exceptions like this:
# target_sequence_alias.CM089167.1 = 1
# The suffix is the alignment's sequence name; the value is the local FASTA name.
# Optional tracks: use a new positive number for each track on that side.
# .path is required for each track used; .label is optional.
# Type is inferred from .bw/.bigwig and .bb/.bigbed; for another suffix,
# explicitly add e.g. target_track.1.type = bigwig.
reference_track.1.path =
reference_track.1.label =
target_track.1.path =
target_track.1.label =
target_track.2.path =
target_track.2.label =
# Optional stable ID, mainly for preserving IDs from older registrations.
# Normally leave it unset; an ID is generated from the label.
id =

---

# REQUIRED FIELDS: example of a second alignment sharing the same anchor
label = GRCh38 to HG00733 maternal
reference_accession = GCA_000001405.29
target_accession = GCA_018506975.2
chain = chains/alt_hg00733_to_ref_grch38.bigChain.bb
indexed_side = target

# OPTIONAL FIELDS: metadata for repeated assemblies must agree across records
reference_assembly_name = GRCh38.p14
target_assembly_name = HG00733_mat_hprc_f2
reference_species = Homo sapiens
target_species = Homo sapiens
# Add any of the optional fields above here as needed.
