[package]
name = "ensembl-sv-renderer"
version = "0.1.0"
edition = "2021"
description = "Off-main-thread structural-variation renderer for Ensembl Go"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.117"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.94", features = [
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "TextMetrics",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.67"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

# Keep production builds deterministic and offline-friendly. Rust release/LTO
# optimization is still applied; this only disables wasm-pack's optional
# Binaryen download/post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
